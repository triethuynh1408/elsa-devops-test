# Overrides for the Traefik ingress controller bundled with k3s.
# One replica = single point of failure: if it sits on a reclaimed spot node,
# every app behind the ingress blips. Two replicas, spread, behind a PDB.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Same idea as the app's preStop sleep: after SIGTERM keep accepting new
    # connections for 10s while kube-proxy on every node drops this pod from
    # the Service. Without it, the k3d load balancer (max_fails=1,
    # fail_timeout=10s) marks every node down after a few refused connections
    # and the whole ingress is unreachable for ~10s on each drain.
    additionalArguments:
      - "--entryPoints.web.transport.lifeCycle.requestAcceptGraceTimeout=10s"
      - "--entryPoints.websecure.transport.lifeCycle.requestAcceptGraceTimeout=10s"
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
