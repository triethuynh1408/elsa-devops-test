image:
  repository: ghcr.io/triethuynh1408/quote-api
  # Immutable git-SHA tag. Changing this line in Git is how a release happens:
  # ArgoCD sees the commit and rolls it out.
  tag: 50e1f14
  pullPolicy: IfNotPresent

# Only used when autoscaling is disabled; with HPA the Deployment has no
# `replicas` field, so ArgoCD and the HPA don't fight over it.
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Each /api/quote burns ~100ms CPU, so 1 core ~= 10 req/s per pod.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

pdb:
  maxUnavailable: 1

placement:
  # Node label that tells spot and on-demand nodepools apart.
  capacityLabel: acme.io/capacity
  # Scheduler preference for spot (cost). 1-100.
  spotWeight: 100
  # Max allowed difference in replica count between the spot and on-demand
  # pools. With 3 replicas, 2 means the 3rd replica can't go to spot, so
  # placement ends up 2 spot + 1 on-demand.
  capacityMaxSkew: 2

ingress:
  enabled: true
  className: traefik
  host: ""          # empty = match any host (localhost in this setup)

service:
  port: 80

app:
  cpuWorkSeconds: "0.1"
