# CI/CD for quote-api - migrated from ci/legacy.gitlab-ci.yml (see MIGRATION-NOTES.md).
#
#   test ─┐
#         ├─> build (+ Trivy gate) ─> push + cosign sign ─> deploy (bump chart tag; ArgoCD syncs)
#   sast ─┘
#
# Pull requests run test, SAST, build and scan, but never push or deploy.
name: ci

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: quote-api
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: app
      # No `|| echo "flaky"`: a failing test fails the pipeline.
      - run: python -m pytest -q
        working-directory: app

  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hard gate: --error exits non-zero on any finding. No allow_failure.
      - name: Semgrep
        run: >
          semgrep scan --error --metrics=off --disable-version-check
          --config p/python --config p/dockerfile --config p/secrets --config p/github-actions
          app/ .github/

  build:
    needs: [test, sast]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write    # push to GHCR with the workflow's own short-lived token
      id-token: write    # keyless cosign signing (OIDC)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        name: Compute image name and tag
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once for the runner's arch and scan it BEFORE anything is published.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate on HIGH/CRITICAL vulnerabilities that have a fix available.
      - name: Trivy image scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0 image --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --no-progress "${IMAGE_NAME}:scan"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      # Keyless: signed with the workflow's OIDC identity, no private key to store.
      - name: Sign image (by digest)
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production   # add required reviewers in repo settings for a manual gate
    permissions:
      contents: write         # commit the new image tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitOps: CI never touches the cluster. It records the new tag in Git;
      # ArgoCD notices the commit and rolls it out. Rollback = git revert.
      # (Pushes made with GITHUB_TOKEN don't trigger workflows, so no loop.)
      - name: Bump image tag in the Helm chart
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1${TAG}/" charts/quote-api/values.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${TAG}\"/" charts/quote-api/Chart.yaml
          git diff --exit-code --quiet && { echo "tag already ${TAG}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: quote-api ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
